name: Build Pressidium MCP workflow social image

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-mcp-workflow-image.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Render approved workflow graphic
        run: |
          mkdir -p 2026-10
          cat > /tmp/pressidium-mcp-workflow.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#08162f"/>
                <stop offset="0.52" stop-color="#10295d"/>
                <stop offset="1" stop-color="#0a1734"/>
              </linearGradient>
              <linearGradient id="mcp" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#4da8ff"/>
                <stop offset="1" stop-color="#43e0c1"/>
              </linearGradient>
              <linearGradient id="pass" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#49d9b5"/>
                <stop offset="1" stop-color="#55e489"/>
              </linearGradient>
              <linearGradient id="fail" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#ff6c80"/>
                <stop offset="1" stop-color="#ff9b5d"/>
              </linearGradient>
              <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
              </filter>
              <style>
                .t{font-family:Arial,Helvetica,sans-serif;fill:#f7fbff}
                .muted{font-family:Arial,Helvetica,sans-serif;fill:#b8c7df}
                .card{fill:#10254b;stroke:#345d97;stroke-width:2}
                .small{font-size:24px;font-weight:700}
                .body{font-size:22px;font-weight:600}
              </style>
            </defs>

            <rect width="1600" height="900" fill="url(#bg)"/>
            <g opacity=".14">
              <circle cx="130" cy="720" r="120" fill="none" stroke="#6ea6ff" stroke-width="4"/>
              <text x="82" y="755" class="t" font-size="105" font-weight="700">W</text>
              <path d="M1280 80h250M1320 120h190M1250 760h260M1300 800h180" stroke="#72a9ff" stroke-width="2" stroke-dasharray="5 10"/>
            </g>

            <text x="800" y="92" class="t" text-anchor="middle" font-size="62" font-weight="800">
              Pressidium <tspan fill="url(#mcp)">MCP</tspan>
            </text>
            <text x="800" y="136" class="muted" text-anchor="middle" font-size="26">
              Scheduled plugin updates with testing, rollback, and production deployment
            </text>

            <!-- top workflow -->
            <g filter="url(#shadow)">
              <rect class="card" x="90" y="210" rx="22" ry="22" width="230" height="150"/>
              <rect class="card" x="390" y="210" rx="22" ry="22" width="260" height="150"/>
              <rect class="card" x="720" y="210" rx="22" ry="22" width="210" height="150"/>
              <rect class="card" x="1000" y="210" rx="22" ry="22" width="210" height="150"/>
              <rect class="card" x="1280" y="210" rx="22" ry="22" width="245" height="150"/>
            </g>

            <!-- simple icons -->
            <g stroke="#6fb4ff" stroke-width="4" fill="none">
              <rect x="135" y="238" width="52" height="45" rx="7"/><path d="M146 230v20M176 230v20M136 257h50"/>
              <circle cx="215" cy="262" r="24" stroke="#48dfb7"/><path d="M204 263l8 8 15-19" stroke="#48dfb7"/>
              <path d="M455 247l28-14 28 14v27c0 22-18 34-28 39-10-5-28-17-28-39z"/><path d="M471 272l10 10 18-24" stroke="#55e489"/>
              <ellipse cx="825" cy="247" rx="36" ry="13"/><path d="M789 247v38c0 8 16 14 36 14s36-6 36-14v-38M789 266c0 8 16 14 36 14s36-6 36-14"/>
              <rect x="1065" y="236" width="78" height="18" rx="4"/><rect x="1065" y="264" width="78" height="18" rx="4"/><rect x="1065" y="292" width="78" height="18" rx="4"/>
              <rect x="1338" y="235" width="86" height="64" rx="8"/><circle cx="1426" cy="303" r="24"/><path d="M1443 320l21 20"/>
            </g>

            <text x="205" y="320" class="t small" text-anchor="middle"><tspan x="205">ChatGPT</tspan><tspan x="205" dy="30">Scheduled Task</tspan></text>
            <text x="520" y="318" class="t small" text-anchor="middle"><tspan x="520">Check updates +</tspan><tspan x="520" dy="30">vulnerabilities</tspan></text>
            <text x="825" y="328" class="t small" text-anchor="middle">Create backup</text>
            <rect x="1058" y="317" width="95" height="28" rx="14" fill="#6f54d8"/><text x="1105" y="338" class="t" text-anchor="middle" font-size="16" font-weight="700">STAGING</text>
            <text x="1105" y="374" class="t small" text-anchor="middle"><tspan x="1105">Update on</tspan><tspan x="1105" dy="30">staging</tspan></text>
            <text x="1402" y="323" class="t small" text-anchor="middle"><tspan x="1402">Visual + functional</tspan><tspan x="1402" dy="30">regression testing</tspan></text>

            <!-- arrows -->
            <g stroke="#79a8d9" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M330 285h50"/><path d="M367 274l13 11-13 11"/>
              <path d="M660 285h50"/><path d="M697 274l13 11-13 11"/>
              <path d="M940 285h50"/><path d="M977 274l13 11-13 11"/>
              <path d="M1220 285h50"/><path d="M1257 274l13 11-13 11"/>
            </g>

            <!-- branch line -->
            <path d="M1402 360v55H790" stroke="#7a9ec9" stroke-width="4" fill="none"/>
            <path d="M790 415v55" stroke="#52dda8" stroke-width="5"/>
            <path d="M1402 415v55" stroke="#ff7d79" stroke-width="5"/>

            <rect x="720" y="445" width="140" height="44" rx="22" fill="url(#pass)"/>
            <text x="790" y="475" class="t" font-size="22" font-weight="800" text-anchor="middle">✓ PASS</text>
            <rect x="1332" y="445" width="140" height="44" rx="22" fill="url(#fail)"/>
            <text x="1402" y="475" class="t" font-size="22" font-weight="800" text-anchor="middle">✕ FAIL</text>

            <!-- pass container -->
            <rect x="350" y="510" width="880" height="190" rx="28" fill="#0c342f" fill-opacity=".78" stroke="#3bc995" stroke-width="2"/>
            <g filter="url(#shadow)">
              <rect x="395" y="548" width="220" height="112" rx="20" fill="#123d38" stroke="#44d0a0" stroke-width="2"/>
              <rect x="680" y="548" width="250" height="112" rx="20" fill="#123d38" stroke="#44d0a0" stroke-width="2"/>
              <rect x="995" y="548" width="180" height="112" rx="20" fill="#123d38" stroke="#44d0a0" stroke-width="2"/>
            </g>
            <text x="505" y="595" class="t body" text-anchor="middle"><tspan x="505">Push to</tspan><tspan x="505" dy="30">production</tspan></text>
            <text x="805" y="595" class="t body" text-anchor="middle"><tspan x="805">Automatic</tspan><tspan x="805" dy="30">instant backup</tspan></text>
            <text x="1085" y="612" class="t body" text-anchor="middle">Report</text>
            <g stroke="#4dd8a5" stroke-width="4" fill="none"><path d="M620 604h50"/><path d="M657 593l13 11-13 11"/><path d="M935 604h50"/><path d="M972 593l13 11-13 11"/></g>

            <!-- fail container -->
            <rect x="1260" y="510" width="300" height="190" rx="28" fill="#3a1b2c" fill-opacity=".82" stroke="#ff746f" stroke-width="2"/>
            <rect x="1290" y="548" width="115" height="112" rx="18" fill="#482235" stroke="#ff746f" stroke-width="2"/>
            <rect x="1420" y="548" width="115" height="112" rx="18" fill="#482235" stroke="#ff746f" stroke-width="2"/>
            <text x="1348" y="594" class="t" font-size="19" font-weight="700" text-anchor="middle"><tspan x="1348">Restore /</tspan><tspan x="1348" dy="28">Roll back</tspan></text>
            <text x="1478" y="594" class="t" font-size="19" font-weight="700" text-anchor="middle"><tspan x="1478">Report</tspan><tspan x="1478" dy="28">failure</tspan></text>

            <line x1="250" y1="775" x2="1350" y2="775" stroke="#35527a" stroke-width="2"/>
            <text x="800" y="830" class="t" text-anchor="middle" font-size="29" font-weight="700">
              One idea for using Pressidium MCP. <tspan fill="url(#mcp)">What would you use it for?</tspan>
            </text>
          </svg>
          SVG

          rsvg-convert -w 1600 -h 900 /tmp/pressidium-mcp-workflow.svg -o 2026-10/pressidium-mcp-workflow.png
          file 2026-10/pressidium-mcp-workflow.png
          test "$(file -b --mime-type 2026-10/pressidium-mcp-workflow.png)" = "image/png"

      - name: Commit binary PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2026-10/pressidium-mcp-workflow.png
          git commit -m "Add Pressidium MCP workflow social image"
          git push
