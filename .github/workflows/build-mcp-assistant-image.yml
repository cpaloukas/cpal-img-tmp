name: Build MCP assistant social image

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-mcp-assistant-image.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - name: Render PNG
        run: |
          mkdir -p 2026-10
          cat > /tmp/mcp-assistant.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
            <rect width="1600" height="900" fill="#000"/>
            <style>
              .t{font-family:Arial,Helvetica,sans-serif;fill:#111827}
              .w{font-family:Arial,Helvetica,sans-serif;fill:#fff}
              .m{font-family:Arial,Helvetica,sans-serif;fill:#64748b}
              .b{font-weight:700}
              .card{fill:#fff;stroke:#dbe4ff;stroke-width:2}
              .cyan{stroke:#10d8df;stroke-width:4;fill:none}
            </style>

            <!-- left app icons -->
            <rect x="70" y="250" width="120" height="120" rx="28" fill="#090909" stroke="#fff" stroke-width="2"/>
            <polygon points="130,270 162,290 162,330 130,350 98,330 98,290" fill="#b9bec8"/>
            <polygon points="130,270 130,310 98,290" fill="#f4f4f5"/>
            <polygon points="130,270 162,290 130,310" fill="#737983"/>
            <polygon points="98,290 130,310 98,330" fill="#9ca3af"/>
            <polygon points="162,290 130,310 162,330" fill="#d1d5db"/>
            <polygon points="98,330 130,310 130,350" fill="#6b7280"/>
            <polygon points="162,330 130,310 130,350" fill="#f3f4f6"/>

            <rect x="70" y="420" width="120" height="120" rx="28" fill="#ff7a47"/>
            <g stroke="#fff" stroke-width="8" stroke-linecap="round">
              <line x1="130" y1="445" x2="130" y2="515"/>
              <line x1="95" y1="480" x2="165" y2="480"/>
              <line x1="106" y1="456" x2="154" y2="504"/>
              <line x1="154" y1="456" x2="106" y2="504"/>
            </g>

            <rect x="70" y="590" width="120" height="120" rx="28" fill="#fff"/>
            <circle cx="130" cy="650" r="34" fill="none" stroke="#111" stroke-width="7"/>
            <path d="M130 615c18 0 33 15 33 33m-66 0c0-18 15-33 33-33m0 66c-18 0-33-15-33-33m66 0c0 18-15 33-33 33" fill="none" stroke="#111" stroke-width="7"/>

            <!-- connectors from app icons -->
            <path class="cyan" d="M190 310h55q18 0 18 18v42"/>
            <path class="cyan" d="M190 480h55q18 0 18-18v-8"/>
            <path class="cyan" d="M190 650h55q18 0 18-18v-58"/>

            <!-- AI assistant card -->
            <rect x="245" y="275" width="350" height="400" rx="18" class="card"/>
            <text x="285" y="320" class="t b" font-size="25">✦ Ai Assistant</text>
            <circle cx="540" cy="308" r="4" fill="#c4b5fd"/>
            <circle cx="554" cy="308" r="4" fill="#c4b5fd"/>
            <circle cx="568" cy="308" r="4" fill="#c4b5fd"/>

            <rect x="280" y="345" width="245" height="125" rx="16" fill="#eef2ff"/>
            <text x="305" y="385" class="t" font-size="22">
              <tspan x="305">Check plugin updates</tspan>
              <tspan x="305" dy="34">on my website and show</tspan>
              <tspan x="305" dy="34">any vulnerabilities.</tspan>
            </text>

            <path d="M275 490h265v126H300l-25 22z" fill="#d7f9f5"/>
            <text x="300" y="530" class="t" font-size="21">
              <tspan x="300">Here are the latest updates</tspan>
              <tspan x="300" dy="32">and security findings from</tspan>
              <tspan x="300" dy="32">your Pressidium sites..</tspan>
            </text>

            <rect x="280" y="625" width="280" height="48" rx="12" fill="#fff" stroke="#c7d2fe" stroke-width="2"/>
            <text x="300" y="656" class="m" font-size="18">Ask anything...</text>
            <path d="M530 641l20-10-8 24-7-8-10 8z" fill="none" stroke="#8b93ff" stroke-width="2"/>

            <!-- connector assistant to dashboard -->
            <path class="cyan" d="M595 388h35q20 0 20 20v73q0 20 20 20h18"/>
            <path class="cyan" d="M595 565h35q20 0 20-20v-24q0-20 20-20h18"/>

            <!-- central dashboard -->
            <rect x="690" y="250" width="565" height="450" rx="18" fill="#f7f8fc"/>
            <rect x="690" y="250" width="165" height="450" rx="18" fill="#16253f"/>
            <rect x="835" y="250" width="420" height="450" fill="#f7f8fc"/>
            <text x="720" y="287" class="w b" font-size="17">▦ PRESSIDIUM</text>

            <g class="w" font-size="17">
              <text x="720" y="340">▣  Websites</text>
              <text x="720" y="385">▰  Backups</text>
              <text x="720" y="430">▥  Analytics</text>
              <text x="720" y="475">◉  Domains</text>
              <text x="720" y="520">▱  Staging</text>
              <text x="720" y="565">●  Users</text>
              <text x="720" y="610">⚙  Settings</text>
            </g>

            <text x="880" y="300" class="t b" font-size="30">Websites</text>
            <rect x="1135" y="268" width="100" height="38" rx="6" fill="#312e81"/>
            <text x="1185" y="293" class="w" font-size="14" text-anchor="middle">+ Add Website</text>

            <g>
              <rect x="880" y="335" width="320" height="72" rx="12" fill="#fff" stroke="#c7d2fe"/>
              <rect x="900" y="352" width="54" height="35" rx="4" fill="#eef2ff"/>
              <text x="970" y="365" class="t b" font-size="18">mywpstore.com</text>
              <rect x="1080" y="346" width="47" height="24" rx="12" fill="#dcfce7"/>
              <text x="1103" y="363" fill="#15803d" font-family="Arial" font-size="13" text-anchor="middle">Live</text>
              <text x="970" y="387" class="m" font-size="15">WordPress 6.6.2</text>
              <text x="1175" y="370" class="m" font-size="24">⋮</text>

              <rect x="880" y="413" width="320" height="72" rx="12" fill="#fff" stroke="#c7d2fe"/>
              <rect x="900" y="430" width="54" height="35" rx="4" fill="#eef2ff"/>
              <text x="970" y="443" class="t b" font-size="18">agency-site.com</text>
              <rect x="1080" y="424" width="47" height="24" rx="12" fill="#dcfce7"/>
              <text x="1103" y="441" fill="#15803d" font-family="Arial" font-size="13" text-anchor="middle">Live</text>
              <text x="970" y="465" class="m" font-size="15">WordPress 6.6.2</text>
              <text x="1175" y="448" class="m" font-size="24">⋮</text>

              <rect x="880" y="491" width="320" height="72" rx="12" fill="#fff" stroke="#c7d2fe"/>
              <rect x="900" y="508" width="54" height="35" rx="4" fill="#eef2ff"/>
              <text x="970" y="521" class="t b" font-size="18">client-project.io</text>
              <rect x="1060" y="502" width="70" height="24" rx="12" fill="#ede9fe"/>
              <text x="1095" y="519" fill="#5b21b6" font-family="Arial" font-size="13" text-anchor="middle">Staging</text>
              <text x="970" y="543" class="m" font-size="15">WordPress 6.5.4</text>
              <text x="1175" y="526" class="m" font-size="24">⋮</text>
            </g>

            <g>
              <rect x="880" y="590" width="95" height="80" rx="10" fill="#fff"/>
              <rect x="990" y="590" width="110" height="80" rx="10" fill="#fff"/>
              <rect x="1115" y="590" width="85" height="80" rx="10" fill="#fff"/>
              <text x="895" y="613" class="m" font-size="13">Total Visits</text>
              <text x="895" y="643" class="t b" font-size="24">125.4K</text>
              <text x="895" y="663" fill="#16a34a" font-family="Arial" font-size="13">+12%</text>
              <text x="1005" y="613" class="m" font-size="13">Bandwidth</text>
              <text x="1005" y="643" class="t b" font-size="24">432GB</text>
              <text x="1005" y="663" fill="#16a34a" font-family="Arial" font-size="13">+8%</text>
              <text x="1130" y="613" class="m" font-size="13">Sites Online</text>
              <text x="1130" y="643" class="t b" font-size="24">12</text>
              <text x="1130" y="663" fill="#16a34a" font-family="Arial" font-size="13">+100%</text>
            </g>

            <!-- right connectors -->
            <path class="cyan" d="M1255 365h45q18 0 18-18v-20q0-18 18-18h8"/>
            <path class="cyan" d="M1255 405h52q18 0 18 18v8q0 18 18 18h1"/>
            <path class="cyan" d="M1255 455h74q18 0 18 18v18h0"/>
            <path class="cyan" d="M1255 500h60q18 0 18 18v34q0 18 18 18"/>
            <path class="cyan" d="M1255 545h52q18 0 18 18v49q0 18 18 18"/>

            <!-- right feature cards -->
            <g>
              <rect x="1340" y="275" width="220" height="55" rx="10" fill="#fff"/>
              <rect x="1340" y="360" width="220" height="55" rx="10" fill="#fff"/>
              <rect x="1340" y="445" width="220" height="55" rx="10" fill="#fff"/>
              <rect x="1340" y="530" width="220" height="55" rx="10" fill="#fff"/>
              <rect x="1340" y="615" width="220" height="55" rx="10" fill="#fff"/>
              <text x="1395" y="309" class="t b" font-size="21">Plugin Updates</text>
              <text x="1395" y="394" class="t b" font-size="21">Backups</text>
              <text x="1395" y="479" class="t b" font-size="21">Logs &amp; Errors</text>
              <text x="1395" y="564" class="t b" font-size="21">Performance</text>
              <text x="1395" y="649" class="t b" font-size="21">Site Management</text>
              <rect x="1352" y="287" width="32" height="32" rx="6" fill="#eef2ff"/>
              <rect x="1352" y="372" width="32" height="32" rx="6" fill="#eef2ff"/>
              <rect x="1352" y="457" width="32" height="32" rx="6" fill="#eef2ff"/>
              <rect x="1352" y="542" width="32" height="32" rx="6" fill="#eef2ff"/>
              <rect x="1352" y="627" width="32" height="32" rx="6" fill="#eef2ff"/>
              <text x="1368" y="309" fill="#5b21b6" font-family="Arial" font-size="20" text-anchor="middle">↻</text>
              <text x="1368" y="394" fill="#5b21b6" font-family="Arial" font-size="20" text-anchor="middle">▣</text>
              <text x="1368" y="479" fill="#5b21b6" font-family="Arial" font-size="20" text-anchor="middle">▤</text>
              <text x="1368" y="564" fill="#5b21b6" font-family="Arial" font-size="20" text-anchor="middle">↗</text>
              <text x="1368" y="649" fill="#5b21b6" font-family="Arial" font-size="20" text-anchor="middle">▧</text>
            </g>
          </svg>
          SVG
          rsvg-convert -w 1600 -h 900 /tmp/mcp-assistant.svg -o 2026-10/pressidium-mcp-ai-assistants.png
          file 2026-10/pressidium-mcp-ai-assistants.png
          test "$(file -b --mime-type 2026-10/pressidium-mcp-ai-assistants.png)" = "image/png"
      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2026-10/pressidium-mcp-ai-assistants.png
          git commit -m "Add Pressidium MCP AI assistant social image"
          git push
