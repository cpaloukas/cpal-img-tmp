name: Prepare social assets

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prepare-social-assets.yml

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download source assets
        run: |
          mkdir -p out
          curl -fL --retry 3 -A "Mozilla/5.0" "https://conversionbridgewp.com/wp-content/themes/conversionbridge3/images/logo.svg" -o /tmp/conversion-bridge-logo.svg
          curl -fL --retry 3 -A "Mozilla/5.0" "https://premium-plugins.com/wp-content/uploads/2020/10/wpactivitylog-1720x1160.jpg" -o /tmp/wp-activity-log.jpg

      - name: Render social-ready images
        run: |
          if command -v magick >/dev/null 2>&1; then
            IMG=magick
          else
            IMG=convert
          fi

          $IMG -background white -density 300 /tmp/conversion-bridge-logo.svg \
            -resize 1000x500 \
            -gravity center \
            -extent 1200x675 \
            -strip out/conversion-bridge.png

          $IMG /tmp/wp-activity-log.jpg \
            -resize 1120x615 \
            -background white \
            -gravity center \
            -extent 1200x675 \
            -strip -quality 88 out/wp-activity-log.jpg

          identify out/conversion-bridge.png out/wp-activity-log.jpg
          ls -lh out/

      - name: Upload prepared images
        uses: actions/upload-artifact@v4
        with:
          name: social-assets-2026-10
          path: out/
